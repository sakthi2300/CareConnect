spring:
  application:
    name: careconnect-backend
  devtools:
    restart:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/careconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 9600
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

server:
  port: 8080

careconnect:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-in-production-very-long-and-random}
      expiration-ms: 3600000
  matching:
    default-radius-km: 10
  twilio:
    # Get these from https://console.twilio.com (free trial works)
    # Leave empty for dry-run mode (SMS logged but not sent)
    account-sid: ${TWILIO_ACCOUNT_SID:}   # starts with AC...
    auth-token: ${TWILIO_AUTH_TOKEN:}      # click "Show" on Twilio dashboard
    from-number: ${TWILIO_FROM_NUMBER:}    # your Twilio phone number e.g. +1234567890
    messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}  # optional alternative to from-number

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

